name: tests
on: [push, pull_request]
jobs:
  offline-suite:
    runs-on: ubuntu-latest
    env:
      VPI_ENCODER: color_hist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -q
